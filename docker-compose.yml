services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: wms_dev
      POSTGRES_PASSWORD: wms_dev_password
      POSTGRES_DB: wms_gudang_acc
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms_dev -d wms_gudang_acc"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://wms_dev:wms_dev_password@db:5432/wms_gudang_acc
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run migrate && npm run seed && npm start"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
